name: No-IP Auto Renew (2FA + Telegram)

on:
  schedule:
    # Chạy tự động lúc 08:00 sáng (giờ Việt Nam - GMT+7) vào Thứ 2, Thứ 4, Thứ 6, Chủ Nhật
    # (No-IP chỉ mở nút Confirm khi tên miền còn <= 7 ngày, chạy cách ngày giúp không bao giờ lỡ lịch)
    - cron: '0 1 * * 0,1,3,5'

  workflow_dispatch:
    inputs:
      debug_level:
        description: 'Mức độ ghi log & chụp ảnh debug (1 = Chuẩn, 2 = Chi tiết từng bước)'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'

concurrency:
  group: "noip-renew"
  cancel-in-progress: true

jobs:
  renew-noip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🌐 Cài đặt Google Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: 📦 Cài đặt thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Chạy kịch bản gia hạn No-IP & gửi ảnh Telegram
        env:
          NOIP_USERNAME: ${{ secrets.NOIP_USERNAME }}
          NOIP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
          NOIP_2FA_SECRET_KEY: ${{ secrets.NOIP_2FA_SECRET_KEY }}
          NOIP_DEBUG: ${{ inputs.debug_level || '2' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python noip_renew.py

      - name: 📸 Lưu ảnh chụp màn hình lên GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noip-screenshots-${{ github.run_number }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 14
