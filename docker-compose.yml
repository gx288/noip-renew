services:
  noip-renew:
    build: .
    container_name: noip-renew
    shm_size: "512m"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - NOIP_USERNAME=${NOIP_USERNAME}
      - NOIP_PASSWORD=${NOIP_PASSWORD}
      - NOIP_2FA_SECRET_KEY=${NOIP_2FA_SECRET_KEY}
      - NOIP_DEBUG=${NOIP_DEBUG:-2}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./screenshots:/app
